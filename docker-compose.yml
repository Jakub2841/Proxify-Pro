services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:80"
    env_file: .env.docker
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - storage:/var/www/html/storage

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: proxify
      MYSQL_USER: proxify
      MYSQL_PASSWORD: secret
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uproxify", "-psecret"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  storage:
  mysql-data:
